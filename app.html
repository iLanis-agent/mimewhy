<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MimeWhy</title>
<style>
  :root { --bg:#101319; --card:#181d27; --ink:#e9edf5; --dim:#9ba6b8; --acc:#f472b6; --acc2:#818cf8;
          --ok:#34d399; --warn:#fbbf24; --info:#60a5fa; --line:#262d3d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:28px 20px 64px; }
  .top { display:flex; align-items:baseline; gap:12px; margin-bottom:18px; }
  h1 { font-size:26px; margin:0; }
  .top a { color:var(--dim); font-size:14px; text-decoration:none; }
  .top a:hover { color:var(--acc2); }
  textarea { width:100%; height:64px; background:#0b0e14; color:#e3d5e8; border:1px solid var(--line); border-radius:10px;
             font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding:12px; }
  .presets { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 6px; }
  .presets button { background:#221c2a; color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:6px 12px;
                    font-size:13px; cursor:pointer; font-family:inherit; }
  .presets button:hover { color:var(--ink); border-color:var(--acc2); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin:14px 0; }
  .card h2 { margin:0 0 10px; font-size:15px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); }
  .note { padding:8px 12px; border-radius:8px; margin:6px 0; font-size:14.5px; border-left:3px solid; }
  .note.ok { background:rgba(52,211,153,.08); border-color:var(--ok); }
  .note.warn { background:rgba(251,191,36,.08); border-color:var(--warn); }
  .note.info { background:rgba(96,165,250,.08); border-color:var(--info); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; color:var(--dim); font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.5px;
       padding:4px 10px 4px 0; border-bottom:1px solid var(--line); }
  td { padding:6px 10px 6px 0; border-bottom:1px solid #1e2530; vertical-align:top; }
  td code { font:13px ui-monospace, Menlo, monospace; color:var(--acc); background:#0b0e14; padding:1px 6px; border-radius:6px; }
  .muted { color:var(--dim); }
  .extbox { margin-top:6px; }
  .extbox input { background:#0b0e14; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 12px;
                  font:14px ui-monospace, Menlo, monospace; width:140px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>MimeWhy</h1><a href="index.html">&larr; what is this</a></div>
  <textarea id="inp" spellcheck="false" placeholder="Paste a Content-Type value: text/html; charset=utf-8"></textarea>
  <div class="presets" id="presets"></div>
  <div id="out"></div>
  <div class="card">
    <h2>Extension lookup</h2>
    <p class="muted" style="margin:0 0 8px">What type should a file get? (Table cross-checked against Python's mimetypes registry.)</p>
    <div class="extbox">.<input id="ext" placeholder="svg" spellcheck="false"> <span id="extout" class="muted"></span></div>
  </div>
</div>
<script src="engine.js?v=371"></script>
<script>
const PRESETS = {"audio with bitrate": "audio/mpeg; bitrate=320000", "multipart boundary": "multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxkTrZu0gW", "Case folding (Text/HTML)": "Text/HTML; Charset=\"utf-8\"", "text/plain (no charset)": "text/plain", "font/woff2": "font/woff2", "ld+json with profile": "application/ld+json; profile=\"https://schema.org\"", "message/rfc822": "message/rfc822", "application/octet-stream": "application/octet-stream", "Quoted parameter value": "application/pdf; name=\"report (final).pdf\"", "charset on an image": "image/svg+xml; charset=utf-8", "Vendor + suffix (vnd.api+json)": "application/vnd.api+json", "Sloppy whitespace": "text/html; charset=\"iso-8859-1\" ; level=1"};
const inp = document.getElementById('inp');
const out = document.getElementById('out');
function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function render() {
  const raw = inp.value.trim();
  if (!raw) { out.innerHTML = ''; return; }
  const p = MimeWhy.parse(raw);
  const notes = MimeWhy.explain(p, raw);
  let h = '';
  if (p.type) {
    h += '<div class="card"><h2>Structure</h2><table><tr><th>Part</th><th>Value</th><th>Meaning</th></tr>';
    h += `<tr><td>type</td><td><code>${esc(p.type)}</code></td><td class="muted">top-level category</td></tr>`;
    h += `<tr><td>subtype</td><td><code>${esc(p.subtype)}</code></td><td class="muted">the specific format</td></tr>`;
    if (p.tree) h += `<tr><td>tree</td><td><code>${esc(p.tree)}.</code></td><td class="muted">registration tree</td></tr>`;
    if (p.suffix) h += `<tr><td>suffix</td><td><code>+${esc(p.suffix)}</code></td><td class="muted">underlying structure</td></tr>`;
    for (const [n, v] of p.params) h += `<tr><td>param</td><td><code>${esc(n)}=${esc(v)}</code></td><td class="muted">modifier (name case-insensitive, value case-sensitive)</td></tr>`;
    h += '</table></div>';
  }
  h += '<div class="card"><h2>What matters here</h2>' +
    (notes.length ? notes.map(n => `<div class="note ${n.sev}">${esc(n.text)}</div>`).join('') : '<p class="muted">Nothing unusual - a clean, registered shape.</p>') + '</div>';
  out.innerHTML = h;
}

const pr = document.getElementById('presets');
for (const name of Object.keys(PRESETS)) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { inp.value = PRESETS[name]; render(); };
  pr.appendChild(b);
}
inp.addEventListener('input', render);

const ext = document.getElementById('ext');
const extout = document.getElementById('extout');
ext.addEventListener('input', () => {
  const e = ext.value.trim().replace(/^\./, '').toLowerCase();
  extout.textContent = e ? (MimeWhy.EXT[e] || 'not in the table - serve application/octet-stream and let the client decide') : '';
});

inp.value = PRESETS['Case folding (Text/HTML)'];
render();
</script>
</body>
</html>
